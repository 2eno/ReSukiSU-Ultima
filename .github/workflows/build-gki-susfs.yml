name: Build GKI Kernel (ReSukiSU Ultima + SUSFS)

# Builds a GKI 2.0 kernel (android15-6.6 by default, e.g. Pixel 10 Pro XL "mustang")
# from the Android Common Kernel with this repository's kernel driver built in,
# hooked through the SUSFS inline hooks (CONFIG_KSU_SUSFS).
#
# Outputs:
#   - <name>-AnyKernel3: flashable as-is (the downloaded artifact zip IS the
#     AnyKernel3 zip) with the ReSukiSU manager, Kernel Flasher, etc.
#   - <name>-Image: raw Image / Image.lz4 / Image.gz + .config, e.g. for
#     `magiskboot repack` of your stock boot.img.

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: 'android15-6.6 release branch ("lts" = newest LTS merge, recommended for current firmware)'
        type: choice
        default: lts
        options:
          - lts
          - 2026-07
          - 2026-04
          - 2026-01
          - 2025-10
          - 2025-09
          - 2025-08
      device:
        description: 'Device codename for the AnyKernel3 device check ("none" disables the check)'
        type: string
        default: mustang
      kpm:
        description: 'Enable KPM (KernelPatch modules): builds with CONFIG_KPM and patches the Image with kpimg'
        type: boolean
        default: true
      susfs_ref:
        description: 'susfs4ksu branch, tag or commit (kernel side must be SUSFS v2.3.0+)'
        type: string
        default: gki-android15-6.6
      manager_expected_size:
        description: 'Optional: signature size of a self-signed manager, e.g. 0x3e6 (empty = key from the KEYSTORE secret if set, else only the built-in managers)'
        type: string
        default: ''
      manager_expected_hash:
        description: 'Optional: signature SHA-256 of a self-signed manager (64 hex chars)'
        type: string
        default: ''
  push:
    paths:
      - '.github/workflows/build-gki-susfs.yml'

permissions:
  contents: read

concurrency:
  group: gki-susfs-${{ github.ref }}-${{ inputs.os_patch_level || 'lts' }}
  cancel-in-progress: true

env:
  ANDROID_VERSION: android15
  KERNEL_VERSION: '6.6'
  OS_PATCH_LEVEL: ${{ inputs.os_patch_level || 'lts' }}
  DEVICE: ${{ inputs.device || 'mustang' }}
  SUSFS_REF: ${{ inputs.susfs_ref || 'gki-android15-6.6' }}
  # push builds have no inputs, KPM is on by default there too
  KPM: ${{ github.event_name != 'workflow_dispatch' || inputs.kpm }}
  # SukiSU KernelPatch patcher, same KernelPatch release (0.12.2) as the
  # kpimg the manager bundles
  KPM_PATCHER_URL: https://github.com/ShirkNeko/SukiSU_KernelPatch_patch/releases/download/0.12.2/patch_linux
  KPM_PATCHER_SHA256: 0fb1ebee20fecca70f2c5a5cb06bf2efce71c84c416132948047129dc6bfc302
  # osm0sis/AnyKernel3 master and its arm64-tools branch (same Magisk utils
  # release), pinned for reproducible flashing behaviour
  ANYKERNEL3_COMMIT: 020dfeccf9d7e962a48400fc94d3e451df92eead
  ANYKERNEL3_ARM64_TOOLS_COMMIT: f1a6f5ec47749252d30cc5e26f71f06b14cba617

jobs:
  build:
    name: GKI ${{ inputs.os_patch_level || 'lts' }} (${{ inputs.device || 'mustang' }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Runs before the cleanup below, which removes the JDK (keytool).
      - name: Resolve manager signature
        id: manager_key
        env:
          INPUT_SIZE: ${{ inputs.manager_expected_size }}
          INPUT_HASH: ${{ inputs.manager_expected_hash }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SIZE" ] || [ -n "$INPUT_HASH" ]; then
            SIZE="$INPUT_SIZE"
            HASH="$INPUT_HASH"
            echo "Using the manager signature from the workflow inputs"
          elif [ -n "$KEYSTORE" ]; then
            # Same key that Build Manager signs this fork's manager with, so
            # kernel and manager built from this repository always match.
            # Accept the usual copy-paste variants of the base64 text. A broken
            # secret must not block the kernel build, it only means no extra
            # manager key.
            if ! ERR=$(python3 - "$RUNNER_TEMP/manager.jks" 2>&1 <<'PY'
          import base64, os, re, sys
          s = os.environ.get("KEYSTORE", "")
          s = re.sub(r"-----(BEGIN|END)[^-]*-----", "", s)  # certutil / PEM armor
          s = re.sub(r"\\[rn]", "", s)                       # literal \n escapes
          s = re.sub(r"^\s*data:[^,]*,", "", s.strip())      # data: URL prefix
          s = re.sub(r"[\s\"']", "", s)
          s = s.replace("-", "+").replace("_", "/")          # base64url
          s = s.rstrip("=")
          s += "=" * (-len(s) % 4)
          bad = sorted(set(re.sub(r"[A-Za-z0-9+/=]", "", s)))
          if bad:
              sys.exit("contains characters that are not base64: " + " ".join(repr(c) for c in bad))
          try:
              data = base64.b64decode(s, validate=True)
          except Exception as e:
              sys.exit(f"cannot be decoded ({e})")
          if data[:4] != b"\xfe\xed\xfe\xed" and data[:1] != b"\x30":
              sys.exit(f"decodes to {len(data)} bytes that are not a JKS/PKCS12 keystore")
          with open(sys.argv[1], "wb") as f:
              f.write(data)
          PY
            ); then
              echo "::warning::The KEYSTORE secret (${#KEYSTORE} characters) ${ERR##*$'\n'}. Store the output of: base64 -w0 your-key.jks. Building without an extra manager key."
              exit 0
            fi
            if ! keytool -exportcert -alias "$KEY_ALIAS" -keystore "$RUNNER_TEMP/manager.jks" \
                -storepass "$KEYSTORE_PASSWORD" -file "$RUNNER_TEMP/manager.der"; then
              echo "::warning::keytool cannot read the KEYSTORE secret (check KEYSTORE_PASSWORD and KEY_ALIAS). Building without an extra manager key."
              rm -f "$RUNNER_TEMP/manager.jks"
              exit 0
            fi
            SIZE=$(printf '0x%04x' "$(stat -c%s "$RUNNER_TEMP/manager.der")")
            HASH=$(sha256sum "$RUNNER_TEMP/manager.der" | awk '{print $1}')
            rm -f "$RUNNER_TEMP/manager.jks" "$RUNNER_TEMP/manager.der"
            echo "Using the manager signing key from the KEYSTORE secret"
          else
            echo "No custom manager signature, only the built-in managers are trusted"
            exit 0
          fi
          if ! [[ "$SIZE" =~ ^0x[0-9a-fA-F]+$ ]] || ! [[ "$HASH" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::manager signature size must look like 0x3e6 and the hash must be 64 hex characters"
            exit 1
          fi
          HASH="${HASH,,}"
          echo "Manager signature: size $SIZE, sha256 $HASH"
          {
            echo "size=$SIZE"
            echo "hash=$HASH"
          } >> "$GITHUB_OUTPUT"

      - name: Maximize build space
        run: |
          echo "Before cleanup:"; df -h / /mnt 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/julia* /opt/az /opt/microsoft \
            /usr/local/lib/node_modules /usr/share/miniconda /usr/local/aws-cli \
            /usr/local/share/boost /usr/lib/jvm || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After cleanup:"; df -h / /mnt 2>/dev/null || true

          # Build on whichever filesystem has more room (/mnt is the runner's
          # temporary disk when present).
          ROOT_FREE=$(df --output=avail -k / | tail -n1)
          MNT_FREE=$(df --output=avail -k /mnt 2>/dev/null | tail -n1 || echo 0)
          if [ "${MNT_FREE:-0}" -gt "$ROOT_FREE" ]; then
            sudo mkdir -p /mnt/gki && sudo chown "$(id -u):$(id -g)" /mnt/gki
            WORK_DIR=/mnt/gki
          else
            WORK_DIR="$GITHUB_WORKSPACE/gki"
            mkdir -p "$WORK_DIR"
          fi
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$WORK_DIR/kernel" >> "$GITHUB_ENV"
          echo "Building in $WORK_DIR"

      - name: Add swap for LTO linking
        run: |
          # Keep the swap file on the same (bigger) disk as the build
          SWAP_FILE="$(dirname "$WORK_DIR")/gki-swapfile"
          sudo fallocate -l 16G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE" >/dev/null
          sudo swapon "$SWAP_FILE"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 zip lz4 file >/dev/null
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync Android Common Kernel (${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.OS_PATCH_LEVEL }})
        run: |
          set -euo pipefail
          BRANCH="${ANDROID_VERSION}-${KERNEL_VERSION}-${OS_PATCH_LEVEL}"
          COMMON_URL=https://android.googlesource.com/kernel/common
          MANIFEST=.repo/manifests/default.xml

          sync_kernel() {
            rm -rf "$KERNEL_DIR"
            mkdir -p "$KERNEL_DIR"
            cd "$KERNEL_DIR"
            repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "common-${BRANCH}" || return 1

            # Google moves retired release branches to deprecated/<branch>, or
            # drops the branch head and keeps only the <branch>_rN tags.
            REFS=$(git ls-remote "$COMMON_URL" "refs/heads/${BRANCH}" "refs/heads/deprecated/${BRANCH}") || return 1
            if ! grep -q "refs/heads/${BRANCH}$" <<<"$REFS"; then
              if grep -q "refs/heads/deprecated/${BRANCH}$" <<<"$REFS"; then
                echo "Branch ${BRANCH} is deprecated, using deprecated/${BRANCH}"
                sed -i "s|\"${BRANCH}\"|\"deprecated/${BRANCH}\"|g" "$MANIFEST"
              else
                TAG=$(git ls-remote --tags "$COMMON_URL" "refs/tags/${BRANCH}_r*" | awk '{print $2}' \
                  | grep -v '\^{}$' | sed 's|refs/tags/||' | sort -V | tail -n1 || true)
                if [ -z "$TAG" ]; then
                  echo "::error::No branch or release tag found for ${BRANCH}"
                  exit 1
                fi
                echo "Branch ${BRANCH} has no head anymore, using tag ${TAG}"
                sed -i "/path=\"common\"/ s|revision=\"${BRANCH}\"|revision=\"refs/tags/${TAG}\"|" "$MANIFEST"
              fi
            fi

            timeout 40m repo sync -c --no-clone-bundle --no-tags --fail-fast -j"$(nproc --all)"
          }

          for attempt in 1 2 3; do
            if sync_kernel; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::repo sync failed"
              exit 1
            fi
            echo "repo sync failed (attempt $attempt), retrying in 30s"
            sleep 30
          done

          cd "$KERNEL_DIR/common"
          SUBLEVEL=$(sed -n 's/^SUBLEVEL = //p' Makefile)
          KMI_GENERATION=$(grep -h '^KMI_GENERATION=' build.config.common build.config.constants 2>/dev/null | head -n1 | cut -d= -f2 || true)
          {
            echo "SUBLEVEL=$SUBLEVEL"
            echo "KMI_GENERATION=$KMI_GENERATION"
            echo "KERNEL_SOURCE_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "Synced ${KERNEL_VERSION}.${SUBLEVEL}-${ANDROID_VERSION}-${KMI_GENERATION} ($(git log -1 --format='%h %cs %s'))"
          df -h "$KERNEL_DIR"

      - name: Checkout ReSukiSU Ultima
        uses: actions/checkout@v7
        with:
          path: ReSukiSU
          # Kbuild derives the version code from the full history
          fetch-depth: 0

      - name: Integrate ReSukiSU Ultima
        run: |
          set -euo pipefail
          # Kbuild needs the git checkout next to the kernel/ directory, so
          # move the whole repository into the kernel workspace.
          mv "$GITHUB_WORKSPACE/ReSukiSU" "$KERNEL_DIR/KernelSU"
          git config --global --add safe.directory "$KERNEL_DIR/KernelSU"
          cd "$KERNEL_DIR/common/drivers"
          ln -sfn ../../KernelSU/kernel kernelsu
          # shellcheck disable=SC2016 # $(CONFIG_KSU) is make syntax
          grep -q 'kernelsu/' Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' Kconfig
          tail -n 3 Makefile Kconfig

          cd "$KERNEL_DIR/KernelSU"
          echo "KSU_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KSU_VERSION_CODE=$((30000 + $(git rev-list --count HEAD) + 700))" >> "$GITHUB_ENV"

      - name: Use custom manager signature
        if: steps.manager_key.outputs.size != ''
        env:
          SIZE: ${{ steps.manager_key.outputs.size }}
          HASH: ${{ steps.manager_key.outputs.hash }}
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR/KernelSU"
          sed -i "1i KSU_EXPECTED_SIZE := ${SIZE}\nKSU_EXPECTED_HASH := ${HASH}" kernel/Kbuild
          # Keep the version name free of the "-dirty" marker
          git update-index --assume-unchanged kernel/Kbuild
          head -n 3 kernel/Kbuild

      - name: Apply SUSFS kernel patches
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git "$WORK_DIR/susfs4ksu"
          cd "$WORK_DIR/susfs4ksu"
          git checkout "$SUSFS_REF"
          SUSFS_VERSION=$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' kernel_patches/include/linux/susfs.h)
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> "$GITHUB_ENV"
          echo "Using SUSFS $SUSFS_VERSION ($(git log -1 --format='%h %cs %s'))"

          cd "$KERNEL_DIR/common"
          cp "$WORK_DIR"/susfs4ksu/kernel_patches/fs/* fs/
          cp "$WORK_DIR"/susfs4ksu/kernel_patches/include/linux/* include/linux/
          # ReSukiSU Ultima already ships the KernelSU side of SUSFS, so only
          # the kernel patch is applied (not 10_enable_susfs_for_ksu.patch).
          if ! patch -p1 --forward --no-backup-if-mismatch \
              < "$WORK_DIR/susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"; then
            echo "::error::SUSFS patch did not apply cleanly to ${KERNEL_VERSION}.${SUBLEVEL}"
            find . -name '*.rej' -print -exec cat {} \;
            exit 1
          fi

          # OPEN_REDIRECT uses VMA_PAD_START(), which only exists once the
          # page-size-migration feature landed in the branch.
          if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && \
             ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
            echo "Added VMA_PAD_START fallback"
          fi

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR/common"
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          set_config() {
            local key="${1%%=*}"
            sed -i "/^${key}=/d; /^# ${key} is not set/d" "$DEFCONFIG"
            echo "$1" >> "$DEFCONFIG"
          }
          for cfg in \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_ENABLE_LOG=y \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
            CONFIG_KSU_SUSFS_SUS_MAP=y \
            CONFIG_TMPFS_XATTR=y \
            CONFIG_TMPFS_POSIX_ACL=y; do
            set_config "$cfg"
          done
          if [ "$KPM" = true ]; then
            set_config CONFIG_KPM=y
          fi
          tail -n 14 "$DEFCONFIG"

          # The added options are not part of the stock savedefconfig output.
          sed -i 's/check_defconfig//' build.config.gki

      - name: Allow stock GKI modules to load
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          # This kernel is signed with a throw-away key, so the stock
          # system_dlkm GKI modules count as unsigned. Without removing the
          # protected exports list they cannot export symbols to the vendor
          # modules and things like Wi-Fi break.
          rm -f common/android/abi_gki_protected_exports_*
          perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' common/BUILD.bazel
          if grep -q 'abi_gki_protected_exports' common/BUILD.bazel; then
            echo "::error::protected_exports_list is still referenced in common/BUILD.bazel"
            grep -n 'abi_gki_protected_exports' common/BUILD.bazel
            exit 1
          fi

      - name: Remove dirty markers
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          if [ -f build/kernel/kleaf/impl/stamp.bzl ]; then
            sed -i '/stable_scmversion_cmd/s/-maybe-dirty//g' build/kernel/kleaf/impl/stamp.bzl
          else
            echo "::warning::build/kernel/kleaf/impl/stamp.bzl not found"
          fi
          sed -i "s/printf '%s' -dirty/printf '%s' ''/" common/scripts/setlocalversion
          cd common
          git add -A
          git commit -q -m "ReSukiSU Ultima + SUSFS ${SUSFS_VERSION}"

      - name: Build kernel
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          # --config=fast builds unsandboxed (--config=local), which keeps the
          # KernelSU git checkout reachable for Kbuild. It does not enable LTO
          # on its own, so ask for thin LTO explicitly.
          tools/bazel build --config=fast --config=stamp --lto=thin //common:kernel_aarch64

      - name: Verify and collect build
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          OUT=bazel-bin/common/kernel_aarch64
          mkdir -p "$WORK_DIR/out/image"
          CONFIG_FILE="$WORK_DIR/out/image/kernel.config"

          # GKI embeds its config (CONFIG_IKCONFIG), read it back from the Image
          if ! common/scripts/extract-ikconfig "$OUT/Image" > "$CONFIG_FILE" 2>/dev/null; then
            FOUND=$(find -L bazel-bin/common/ -path '*kernel_aarch64_config*' -name .config -type f 2>/dev/null | head -n1 || true)
            if [ -z "$FOUND" ]; then
              echo "::error::Could not find the kernel config"
              exit 1
            fi
            cp "$FOUND" "$CONFIG_FILE"
          fi
          REQUIRED="CONFIG_KSU=y CONFIG_KSU_SUSFS=y CONFIG_LTO_CLANG_THIN=y"
          [ "$KPM" != true ] || REQUIRED="$REQUIRED CONFIG_KPM=y"
          for cfg in $REQUIRED; do
            grep -qx "$cfg" "$CONFIG_FILE" || { echo "::error::$cfg missing from the built kernel"; exit 1; }
          done
          grep -E '^CONFIG_(KSU|KPM|TMPFS_XATTR|TMPFS_POSIX_ACL|LTO_CLANG)' "$CONFIG_FILE"

          strings "$OUT/Image" > "$WORK_DIR/image.strings"
          LINUX_BANNER=$(grep -m1 '^Linux version ' "$WORK_DIR/image.strings" || true)
          KERNEL_RELEASE=$(echo "$LINUX_BANNER" | awk '{print $3}')
          KSU_VERSION_NAME=$(grep -m1 -oE '[^ ]*@ReSukiSU' "$WORK_DIR/image.strings" || echo "n/a")
          if [ -z "$KERNEL_RELEASE" ]; then
            echo "::error::Could not read the kernel release from Image"
            exit 1
          fi
          echo "Kernel: $LINUX_BANNER"
          echo "ReSukiSU: $KSU_VERSION_NAME"

          NAME="ReSukiSU-Ultima-SUSFS"
          [ "$KPM" != true ] || NAME="${NAME}-KPM"
          NAME="${NAME}_${KERNEL_RELEASE}"
          [ "$DEVICE" = none ] || NAME="${NAME}_${DEVICE}"
          {
            echo "KERNEL_RELEASE=$KERNEL_RELEASE"
            echo "LINUX_BANNER=$LINUX_BANNER"
            echo "KSU_VERSION_NAME=$KSU_VERSION_NAME"
            echo "ARTIFACT_NAME=$NAME"
          } >> "$GITHUB_ENV"

          cp "$OUT/Image" "$OUT/Image.lz4" "$OUT/Image.gz" "$WORK_DIR/out/image/"
          (cd "$WORK_DIR/out/image" && sha256sum Image Image.lz4 Image.gz > sha256sums.txt)
          ls -la "$WORK_DIR/out/image"

      - name: Patch KPM into Image
        if: env.KPM == 'true'
        run: |
          set -euo pipefail
          KPM_DIR="$WORK_DIR/kpm"
          mkdir -p "$KPM_DIR"
          curl -fsSL "$KPM_PATCHER_URL" -o "$KPM_DIR/patch_linux"
          echo "$KPM_PATCHER_SHA256  $KPM_DIR/patch_linux" | sha256sum -c -
          chmod +x "$KPM_DIR/patch_linux"

          # patch_linux reads ./Image and writes the patched kernel to ./oImage
          cp "$WORK_DIR/out/image/Image" "$KPM_DIR/Image"
          (cd "$KPM_DIR" && ./patch_linux)
          if [ ! -s "$KPM_DIR/oImage" ] || cmp -s "$KPM_DIR/Image" "$KPM_DIR/oImage"; then
            echo "::error::patch_linux did not produce a patched Image"
            exit 1
          fi

          cd "$WORK_DIR/out/image"
          mv "$KPM_DIR/oImage" Image
          # Regenerate the compressed variants from the patched Image
          lz4 -f -l -12 --favor-decSpeed Image Image.lz4
          gzip -n -9 -c Image > Image.gz
          sha256sum Image Image.lz4 Image.gz > sha256sums.txt
          ls -la

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          AK3="$WORK_DIR/out/AnyKernel3"
          git clone https://github.com/osm0sis/AnyKernel3.git "$AK3"
          git -C "$AK3" checkout -q "$ANYKERNEL3_COMMIT"

          # The default tools are 32-bit ARM, which 64-bit-only SoCs such as
          # Tensor G3+ (Pixel 8 and newer) cannot execute at all. Use the
          # upstream arm64 builds instead.
          git -C "$AK3" fetch -q origin "$ANYKERNEL3_ARM64_TOOLS_COMMIT"
          git -C "$AK3" archive "$ANYKERNEL3_ARM64_TOOLS_COMMIT" | tar -x -C "$AK3/tools"
          rm -rf "$AK3/.git" "$AK3/.github" "$AK3/README.md" "$AK3/modules" "$AK3/patch" "$AK3/ramdisk"
          file "$AK3"/tools/*
          if file "$AK3"/tools/* | grep 'ELF' | grep -v 'ARM aarch64'; then
            echo "::error::AnyKernel3 tools must all be arm64 binaries"
            exit 1
          fi

          if [ "$DEVICE" = none ]; then
            DEVICE_CHECK=0
            DEVICE_NAME=
          else
            DEVICE_CHECK=1
            DEVICE_NAME="$DEVICE"
          fi
          KPM_LABEL=
          [ "$KPM" != true ] || KPM_LABEL=" + KPM"

          cat > "$AK3/anykernel.sh" <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=ReSukiSU Ultima + SUSFS ${SUSFS_VERSION}${KPM_LABEL} | ${KERNEL_RELEASE}
          do.devicecheck=${DEVICE_CHECK}
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${DEVICE_NAME}
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          NO_MAGISK_CHECK=1;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          case "\$(uname -r)" in
            ${KERNEL_VERSION}.*-${ANDROID_VERSION}-*) ;;
            *) ui_print " " "Warning: running kernel \$(uname -r) is not ${ANDROID_VERSION}-${KERNEL_VERSION}, make sure this is the right kernel!";;
          esac;

          # GKI boot.img only carries the kernel: swap it, keep the original header
          split_boot;
          flash_boot;
          ## end boot install
          EOF
          sh -n "$AK3/anykernel.sh"

          cp "$WORK_DIR/out/image/Image" "$AK3/Image"
          ls -la "$AK3"
          cat "$AK3/anykernel.sh"

      - name: Upload AnyKernel3 (flashable zip)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-AnyKernel3
          path: ${{ env.WORK_DIR }}/out/AnyKernel3/
          if-no-files-found: error
          compression-level: 9

      - name: Upload kernel images
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-Image
          path: ${{ env.WORK_DIR }}/out/image/
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          MANAGER_SIZE: ${{ steps.manager_key.outputs.size }}
          MANAGER_HASH: ${{ steps.manager_key.outputs.hash }}
        run: |
          {
            echo "## ReSukiSU Ultima + SUSFS GKI kernel"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Kernel | \`${KERNEL_RELEASE:-n/a}\` |"
            echo "| ACK branch | \`common-${ANDROID_VERSION}-${KERNEL_VERSION}-${OS_PATCH_LEVEL}\` @ \`${KERNEL_SOURCE_COMMIT:-n/a}\` |"
            echo "| KMI generation | \`${KMI_GENERATION:-n/a}\` |"
            echo "| ReSukiSU Ultima | \`${KSU_VERSION_NAME:-n/a}\` (version code ${KSU_VERSION_CODE:-n/a}, \`${KSU_COMMIT:-n/a}\`) |"
            echo "| SUSFS | \`${SUSFS_VERSION:-n/a}\` @ \`${SUSFS_COMMIT:-n/a}\` |"
            echo "| Hook mode | SuSFS Inline Hook |"
            echo "| KPM | \`${KPM}\` |"
            echo "| Extra trusted manager | \`${MANAGER_SIZE:-none}\` \`${MANAGER_HASH:-}\` |"
            echo "| Device check | \`${DEVICE}\` |"
            echo
            echo "Flash the **AnyKernel3** artifact (the downloaded zip is flashable as-is) with the"
            echo "ReSukiSU manager or Kernel Flasher. The **Image** artifact holds the raw kernel for"
            echo "\`magiskboot\` repacking of your stock \`boot.img\`."
          } >> "$GITHUB_STEP_SUMMARY"
